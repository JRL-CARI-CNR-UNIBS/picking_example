# vgn_grasp_server parameters for the example. The node runs in the robostack
# environment (ros2_robostack_ws):
#   ros2 launch vgn_grasp_server vgn_grasp_server.launch.py params_file:=<this file>
# scene_updater_wrist/acquire_grasps sends the views with their poses and a
# volume around each object, so the default workspace below is not used.
vgn_grasp_server:
  ros__parameters:
    use_sim_time: true
    device: "auto"
    target_frame: "world"
    workspace_min: [0.10, -0.60, 0.965]   # rail top (1.015) - 0.05
    workspace_max: [0.50, 0.40, 1.265]
    voxel_size: 0.0075
    tile_stride: 20
    quality_threshold: 0.8
    max_depth: 1.5
    max_width: 0.08            # Robotiq 2F-85: 0.085
    finger_height: 0.02
    finger_length: 0.05
    center_shift: 0.025
    tf_timeout: 0.5
    publish_markers: true
