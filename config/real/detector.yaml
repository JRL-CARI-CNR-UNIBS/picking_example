# yolo_rgbd_detector parameters for the REAL cell (wrist RealSense images).
# The detector runs in its own environment (detector_ws on nyquist):
#   ros2 run yolo_rgbd_detector detector_node --ros-args --params-file <this file>
# confidence_threshold is a first guess for camera images (sim: 0.35): tune it.
yolo_rgbd_detector:
  ros__parameters:
    model: "yolo11s-seg.pt"
    use_sim_time: false
    device: ""
    confidence_threshold: 0.5
    iou_threshold: 0.45
    image_size: 640
    use_mask: true
    roi_scale: 0.5
    min_depth: 0.1
    max_depth: 3.0
    depth_scale: 0.0           # auto: 16UC1 mm, as the RealSense driver
    min_depth_band: 0.03
    min_points: 20
    exclude_occluders: true
    box_mode: "yaw"
    merge_distance: 0.1
    merge_size_factor: 0.5
    tf_timeout: 0.5
    publish_debug: true
